name: Windows release executable

on:
  pull_request:
    paths:
      - .github/workflows/windows-release.yml
      - omarchy/**
      - native/Music.c
      - native/Music.h
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach Blitz-1.2-Windows-x64.exe to
        required: true
        default: v1.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf
      - name: Build a self-contained Windows executable
        shell: msys2 {0}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          export PATH="$(cygpath -u "$CARGO_HOME")/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path omarchy/Cargo.toml
          cp omarchy/target/x86_64-pc-windows-gnu/release/blitz-omarchy.exe Blitz-1.2-Windows-x64.exe
          dlls="$(objdump -p Blitz-1.2-Windows-x64.exe | sed -n 's/.*DLL Name: //p')"
          if printf '%s\n' "$dlls" | grep -Eiq 'SDL2|zlib|libgcc|libwinpthread'; then
            printf 'The executable still depends on a non-Windows runtime DLL:\n%s\n' "$dlls"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Blitz-1.2-Windows-x64
          path: Blitz-1.2-Windows-x64.exe
          if-no-files-found: error
      - name: Select release tag
        if: github.event_name != 'pull_request'
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG_INPUT"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: Blitz-1.2-Windows-x64.exe
          overwrite_files: true
